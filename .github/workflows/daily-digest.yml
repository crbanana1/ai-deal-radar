name: Daily Digest

on:
  schedule:
    # 北京时间 10:00-14:50 每 10 分钟尝试；10:30 前由 gate 跳过。
    - cron: "*/10 2-6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Beijing time
        id: gate
        run: |
          now=$(date -u -d '+8 hours' +%H%M)
          now=$((10#$now))
          today=$(date -u -d '+8 hours' +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "$now" -lt 1030 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "UTC+8 date=$today time=$now"

      - name: Restore today's sent marker
        if: steps.gate.outputs.skip != 'true'
        id: sent
        uses: actions/cache/restore@v4
        with:
          path: digest-state
          key: daily-digest-sent-${{ steps.gate.outputs.today }}

      - name: Send daily digest
        if: steps.gate.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          python scripts/daily_digest.py
          mkdir -p digest-state
          date -u -d '+8 hours' '+%F %T UTC+8' > digest-state/sent-at

      - name: Save today's sent marker
        if: steps.gate.outputs.skip != 'true' && steps.sent.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: digest-state
          key: daily-digest-sent-${{ steps.gate.outputs.today }}
