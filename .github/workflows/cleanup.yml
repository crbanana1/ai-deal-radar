name: Cleanup Caches

on:
  schedule:
    # 每 3 天清理一次缓存和构建产物；不删除 workflow run，避免影响 TrendRadar 的 7 天签到计时。
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete caches older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting caches older than $cutoff"
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json id,createdAt \
            --jq ".[] | select(.createdAt < \"$cutoff\") | .id" |
          while read -r id; do
            if [ -n "$id" ]; then
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done

      - name: Delete artifacts older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting artifacts older than $cutoff"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            fi
          done
